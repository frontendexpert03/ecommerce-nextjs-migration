<header class="main-container flex h-full w-screen flex-col items-center bg-k-black" data-test="nav-desktop" id="navi">
  <div class="relative flex w-4/5 max-w-6xl flex-row items-center justify-between border-b border-zinc-500 py-6 md:w-11/12 lg:w-4/5">
    <button class="select-none lg:hidden" data-test="hamburger" id="hamburger">
      <svg class="h-8 w-8" fill="none" stroke-width="2" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" stroke-linecap="round" stroke-linejoin="round">
        </path>
      </svg>
    </button>
    <a aria-current="page" class="router-link-active router-link-exact-active text-3xl font-extrabold tracking-tight antialiased transition duration-300 hover:scale-110 hover:text-k-main" data-test="nav-logo" href="/">
      "KIIIBS"
    </a>
    <nav class="hidden tracking-widest lg:flex lg:gap-8">
      <a aria-current="page" class="router-link-active router-link-exact-active uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5" data-test="nav-home" href="/">
        "Home"
      </a>
      <a class="uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5" data-test="nav-keyboards" href="/keyboards">
        "Keyboards"
      </a>
      <a class="uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5" data-test="nav-keycaps" href="/keycaps">
        "Keycaps"
      </a>
      <a class="uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5" data-test="nav-deskmats" href="/deskmats">
        "Deskmats"
      </a>
    </nav>
    <div class="relative h-5 cursor-pointer" data-test="cart-button">
      <img alt="" class="h-full hover:opacity-50 active:translate-y-0.5" src="/icons/cart-icon.svg">
      <div class="absolute -right-2 top-3 flex h-4 w-4 flex-col items-center justify-center rounded-full bg-red-600 text-xs font-black transition-all duration-300" data-test="cart-bubble" style="display: none;">
        "0"
      </div>
    </div>
  </div>
  <div class="fixed z-50 flex h-screen w-full flex-col items-center backdrop-blur-sm lg:block lg:items-start" data-test="cart-modal" style="display: none;">
    <div class="absolute h-screen w-full bg-black opacity-40 lg:relative" data-test="cart-background">
    </div>
    <div class="relative mt-16 flex h-full max-h-[80%] w-11/12 max-w-[32rem] flex-col items-center rounded-lg bg-white opacity-100 lg:absolute lg:right-10 lg:top-10 lg:mt-0 lg:w-1/3">
      <button class="mb-4 mt-8 cursor-pointer self-start px-6 font-semibold text-black opacity-60 lg:px-10" data-test="cart-close-button">
        "Close"
      </button>
      <div class="mb-8 flex w-full flex-row items-end justify-between px-6 lg:px-10">
        <p class="font-Manrope text-2xl font-bold text-k-black lg:text-3xl" data-test="cart-header">
          "CART (0)"
        </p>
        <p class="cursor-pointer text-k-dark-grey underline opacity-70 transition hover:opacity-100 active:translate-y-0.5" data-test="cart-delete-all">
          "Delete All"
        </p>
      </div>
      <div class="text-lg text-black opacity-60 lg:text-xl" data-test="cart-empty-message">
        "No items in cart."
      </div>
      <div class="mb-10 flex h-full w-full flex-col gap-5 overflow-y-scroll" data-test="cart-item-container">
      </div>
      <div class="mb-6 flex w-full flex-row justify-between px-6 lg:px-10" data-test="cart-total-section">
        <p class="text-xl font-semibold text-black opacity-50 lg:text-2xl">
          "TOTAL"
        </p>
        <p class="text-2xl font-bold text-black">
          "$0"
        </p>
      </div>
    </div>
  </div>
  <nav class="absolute flex w-screen flex-row justify-around gap-2 bg-black p-9 text-xs font-semibold tracking-widest bg-k-black" data-test="nav-mobile">
    <button class="lg:text-md uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5 md:text-lg" data-test="close-hamburger">
      "Close"
    </button>
    <a aria-current="page" class="router-link-active router-link-exact-active lg:text-md uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5 md:text-lg hidden" data-test="mobile-nav-home" href="/">
      "Home"
    </a>
    <a class="lg:text-md uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5 md:text-lg" data-test="mobile-nav-keyboards" href="/keyboards">
      "Keyboards"
    </a>
    <a class="lg:text-md uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5 md:text-lg" data-test="mobile-nav-keycaps" href="/keycaps">
      "Keycaps"
    </a>
    <a class="lg:text-md uppercase text-white transition duration-300 hover:text-k-main active:translate-y-0.5 md:text-lg" data-test="mobile-nav-deskmats" href="/deskmats">
      "Deskmats"
    </a>
  </nav>
</header>
